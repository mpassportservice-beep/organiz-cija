# Render blueprint: one web service with a 1 GB disk for the SQLite database.
services:
  - type: web
    name: smidzinasanas-logs
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/spray.sqlite
      - key: VAPID_SUBJECT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: OWNER_EMAIL
        sync: false
